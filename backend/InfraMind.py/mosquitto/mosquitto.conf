# Mosquitto config for HIMADRI's MQTT telemetry ingest (backend/services/mqtt_ingest.py).
# Hackathon/demo simplicity — anonymous access, no TLS — matching the rest
# of this stack's own documented security posture (see
# context/PROJECT_CONTEXT.md's Security Rules and README's Verification
# notes). Not a production configuration.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
